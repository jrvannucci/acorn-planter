[project]
name = "acorn"
# Read from acorn/__init__.py (see [tool.hatch.version]) so the version
# lives in exactly one place -- `acorn --version` reports the same string the
# built distribution carries, and a bump is a one-line edit.
dynamic = ["version"]
description = "Global Python environments and development suites, ready when you are."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
acorn-cli = "acorn.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "acorn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["acorn"]
