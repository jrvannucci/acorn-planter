<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 150" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <style>
      .head { font-family: Georgia, 'Times New Roman', serif; }
      .body { font-family: Arial, Helvetica, sans-serif; }
    </style>
    <marker id="mf-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8A8A8A"/>
    </marker>
  </defs>

<rect x="40" y="33" width="190" height="84" rx="10" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.4"/><text x="135" y="70" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">Run the online or</text><text x="135" y="90" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">offline installer</text>
<line x1="230" y1="75" x2="258" y2="75" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#mf-arrow)"/>
<rect x="264" y="33" width="260" height="84" rx="10" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.4"/><text x="394" y="70" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">ACORN prepares your</text><text x="394" y="90" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">configured Python suite</text>
<line x1="524" y1="75" x2="552" y2="75" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#mf-arrow)"/>
<rect x="558" y="33" width="190" height="84" rx="10" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.4"/><text x="653" y="70" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">Open a new</text><text x="653" y="90" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#1B4332">terminal</text>
<line x1="748" y1="75" x2="776" y2="75" stroke="#8A8A8A" stroke-width="1.6" marker-end="url(#mf-arrow)"/>
<rect x="782" y="33" width="330" height="84" rx="10" fill="#1B4332" stroke="#1B4332" stroke-width="1.4"/><text x="947" y="60" text-anchor="middle" class="body" font-size="13.5" font-weight="700" fill="#FFFFFF">Your suite is ready</text><text x="947" y="80" text-anchor="middle" class="body" font-size="13.5" font-weight="400" fill="#FFFFFF">acorn install requests adds packages</text><text x="947" y="100" text-anchor="middle" class="body" font-size="13.5" font-weight="400" fill="#FFFFFF">acorn vscode opens the editor</text>
</svg>