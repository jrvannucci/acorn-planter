<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">ACORN: your Python development suite</title>
<desc id="desc">Global settings connect your Python environments, packages, editors, and tools. Profiles describe suites; offline bundles carry their resources.</desc>
<rect width="1000" height="770" rx="18" fill="#FFFFFF"/>
<g transform="translate(42 27)" stroke="#1B4332" stroke-width="3"><path d="M8 28 Q7 58 30 69 Q53 58 52 28 Z" fill="#D8A66D"/><path d="M3 29 Q4 9 30 9 Q56 9 57 29 Z" fill="#1B4332"/><path d="M30 10 Q27 0 36 -2" fill="none" stroke-linecap="round"/></g>
<text x="125" y="78" font-size="46" fill="#1B4332" font-weight="700">ACORN</text>
<text x="44" y="129" font-size="27" fill="#1B4332" font-weight="700">Global Python environments and development suites,</text>
<text x="44" y="166" font-size="27" fill="#1B4332" font-weight="700">ready when you are.</text>
<text x="44" y="207" font-size="20" fill="#1B4332" font-weight="400">One CLI. Shared settings across your environments. A suite that fits your work.</text>
<rect x="40" y="240" width="920" height="88" rx="12" fill="#E9F5EC"/>
<text x="62" y="273" font-size="23" fill="#1B4332" font-weight="700">Configure globally</text>
<text x="62" y="302" font-size="18" fill="#1B4332" font-weight="400">global.conf supplies installation settings; acorn config manages your defaults.</text>
<rect x="40" y="344" width="920" height="88" rx="12" fill="#E9F5EC"/>
<text x="62" y="377" font-size="23" fill="#1B4332" font-weight="700">Build your environments</text>
<text x="62" y="406" font-size="18" fill="#1B4332" font-weight="400">Manage Python versions, virtual environments, packages, and repositories.</text>
<rect x="40" y="448" width="920" height="88" rx="12" fill="#E9F5EC"/>
<text x="62" y="481" font-size="23" fill="#1B4332" font-weight="700">Bring your development tools</text>
<text x="62" y="510" font-size="18" fill="#1B4332" font-weight="400">Connect VS Code, Spyder, Python applications, and conda-forge tools.</text>
<rect x="40" y="552" width="920" height="88" rx="12" fill="#E9F5EC"/>
<text x="62" y="585" font-size="23" fill="#1B4332" font-weight="700">Prepare for offline work</text>
<text x="62" y="614" font-size="18" fill="#1B4332" font-weight="400">Bundle resources online, validate profiles, then install on the offline network.</text>
<text x="44" y="704" font-size="24" fill="#1B4332" font-weight="700">Your managed suite lives under ~/acorn</text>
<text x="44" y="737" font-size="20" fill="#1B4332" font-weight="400">acorn venv dev   ·   acorn install pandas   ·   acorn vscode</text>
</svg>