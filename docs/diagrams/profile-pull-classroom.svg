  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Classroom</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">Pinned, reproducible -- installs straight from the internet</text>

<rect x="640" y="110" width="320" height="64" rx="12" fill="#52796F"/><use href="#ic-terminal" x="656" y="122" width="20" height="20" color="#FFFFFF"/><text x="684" y="137" class="body fw" font-size="14.0" font-weight="700">GET_STARTED/install.cmd</text><text x="656" y="151" class="body" fill="#CFE3D6" font-size="10" font-style="italic">you (or a script) run this -- on each machine, once</text>
<line x1="800" y1="174" x2="800" y2="320" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="40" y="202" width="320" height="94" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="58" y="215" width="22" height="22" color="#FFFFFF"/>
<text x="92" y="230" class="body fw" font-size="14" font-weight="700">global.conf</text>
<text x="58" y="246" class="body" fill="#CFE3D6" font-size="10" font-style="italic">read at install, on every machine</text>
<line x1="58" y1="256" x2="342" y2="256" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
<rect x="58" y="264" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="67" y="279" class="body fg" font-size="11.5" font-weight="600">ACORN_PROFILE  →  installation-profile/</text>
<line x1="360" y1="249" x2="796" y2="249" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="580" y="241" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">ACORN_PROFILE -&gt; the profile folder</text>
<rect x="640" y="324" width="320" height="174" rx="12" fill="#1B4332"/>
<use href="#ic-doc" x="658" y="337" width="22" height="22" color="#FFFFFF"/>
<text x="692" y="352" class="body fw" font-size="14.0" font-weight="700">installation-profile/</text>
<text x="658" y="368" class="body" fill="#CFE3D6" font-size="10" font-style="italic">self-contained TOML profiles; default</text>
<text x="658" y="380" class="body" fill="#CFE3D6" font-size="10" font-style="italic">for everyone, others selected by their</text>
<text x="658" y="392" class="body" fill="#CFE3D6" font-size="10" font-style="italic">user lists</text>
<line x1="658" y1="402" x2="942" y2="402" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
<rect x="658" y="410" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="425" class="body fg" font-size="11.5" font-weight="600">python = [...]  →  python/base/</text>
<rect x="658" y="438" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="453" class="body fg" font-size="11.5" font-weight="600">[[venv]]  →  python/venvs/</text>
<rect x="658" y="466" width="284" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="667" y="481" class="body fg" font-size="11.5" font-weight="600">editor = ...  →  extensions/</text>
<line x1="800" y1="498" x2="800" y2="528" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="810" y="519" class="body fmute" font-size="10.5" font-style="italic">install + acorn apply</text>
<rect x="640" y="532" width="320" height="366" rx="12" fill="#EAF3EE" stroke="#1B4332" stroke-width="1.2"/>
<use href="#ic-monitor" x="662" y="536" width="24" height="24" color="#1B4332"/>
<text x="696" y="553" class="body fg" font-size="15" font-weight="700">YOUR MACHINE</text>
<text x="662" y="570" class="body fmute" font-size="11.5" font-style="italic">every lab machine, identical pins</text>
<line x1="662" y1="575" x2="938" y2="575" stroke="#1B4332" stroke-width="1" opacity="0.25"/>
<text x="662" y="586" class="body fg" font-size="10.5" font-weight="700" letter-spacing="0.6">WHAT THE USER HAS</text>
<rect x="654" y="600" width="292" height="42" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="606" width="15" height="15" color="#1B4332"/>
<text x="681" y="617" class="body fg" font-size="12.0" font-weight="700">system/src/</text>
<text x="681" y="628" class="body fmute" font-size="9.5" font-style="italic">acorn's own source</text>
<rect x="654" y="654" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="660" width="15" height="15" color="#1B4332"/>
<text x="681" y="671" class="body fg" font-size="12.0" font-weight="700">python/base/</text>
<text x="681" y="682" class="body fmute" font-size="9.5" font-style="italic">interpreters</text>
<rect x="664" y="686" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="700" class="body fg" font-size="11.5" font-weight="600">3.12</text>
<rect x="654" y="729" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="735" width="15" height="15" color="#1B4332"/>
<text x="681" y="746" class="body fg" font-size="12.0" font-weight="700">python/venvs/</text>
<text x="681" y="757" class="body fmute" font-size="9.5" font-style="italic">one folder per venv</text>
<rect x="664" y="761" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="776" class="body fg" font-size="11.5" font-weight="600">phys201</text>
<rect x="654" y="804" width="292" height="63" rx="8" fill="#E9F5EC" stroke="#1B4332" stroke-width="1"/>
<use href="#ic-folder" x="662" y="810" width="15" height="15" color="#1B4332"/>
<text x="681" y="821" class="body fg" font-size="12.0" font-weight="700">extensions/spyder-config/</text>
<text x="681" y="832" class="body fmute" font-size="9.5" font-style="italic">the editor's local settings</text>
<rect x="664" y="836" width="272" height="21" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="673" y="850" class="body fg" font-size="11.5" font-weight="600">Spyder</text>
<rect x="40" y="532" width="470" height="92" rx="12" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.3"/>
<use href="#ic-cloud" x="56" y="544" width="20" height="20" color="#1B4332"/>
<text x="84" y="559" class="body fg" font-size="15.0" font-weight="700">github.com</text>
<text x="84" y="573" class="body fmute" font-size="11.0" font-style="italic">the public acorn repo</text>
<rect x="54" y="578" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="599" class="body fg" font-size="13.0" font-weight="700">acorn itself</text>
<line x1="510" y1="594" x2="636" y2="594" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="588" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">the install one-liner</text>
<rect x="40" y="650" width="470" height="132" rx="12" fill="#E9F5EC" stroke="#1B4332" stroke-width="1.3"/>
<use href="#ic-cloud" x="56" y="662" width="20" height="20" color="#1B4332"/>
<text x="84" y="677" class="body fg" font-size="15.0" font-weight="700">pypi.org</text>
<text x="84" y="691" class="body fmute" font-size="11.0" font-style="italic">package index</text>
<rect x="54" y="696" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="717" class="body fg" font-size="13.0" font-weight="700">Packages (pinned)</text>
<line x1="510" y1="712" x2="636" y2="712" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="706" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">acorn apply</text>
<rect x="54" y="736" width="442" height="32" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="66" y="757" class="body fg" font-size="13.0" font-weight="700">Spyder</text>
<line x1="510" y1="752" x2="636" y2="752" stroke="#1B4332" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="575" y="746" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">acorn spyder</text>
<text x="40" y="932" class="body fmute" font-size="12" font-style="italic">If the lab machines have no internet, build a bundle instead -- see Air-gapped (everything) and take only the pieces you need.</text>
</svg>