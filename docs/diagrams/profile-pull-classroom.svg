<rect x="0" y="0" width="1000" height="974" fill="#FFFFFF"/>

  <g transform="translate(40,20)">
    <path d="M2 20 Q2 37 16 44 Q30 37 30 20 Z" fill="#D8A66D" stroke="#1B4332" stroke-width="1.6"/>
    <path d="M0 21 Q0 8 16 8 Q32 8 32 21 Z" fill="#1B4332"/>
