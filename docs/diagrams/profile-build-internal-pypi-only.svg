  <text x="94" y="54" class="head fg" font-size="25" font-weight="700">Internal PyPI only</text>
  <text x="40" y="79" class="body fmute" font-size="13.5" font-style="italic">Bundle tools and wheels; upload wheels to the internal index</text>

<g transform="translate(0,54)"><rect x="544" y="0" width="372" height="76" rx="12" fill="#52796F"/><use href="#ic-terminal" x="560" y="12" width="20" height="20" color="#FFFFFF"/><text x="588" y="27" class="body fw" font-size="14.0" font-weight="700">offline-bundler.cmd</text><text x="560" y="41" class="body" fill="#CFE3D6" font-size="10" font-style="italic">bundles acorn-planter and its resources on a connected machine;</text><text x="560" y="53" class="body" fill="#CFE3D6" font-size="10" font-style="italic">run with no arguments</text><line x1="730" y1="76" x2="730" y2="346" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="200" y="104" width="320" height="218" rx="12" fill="#1B4332"/><use href="#ic-doc" x="216" y="116" width="20" height="20" color="#FFFFFF"/><text x="244" y="131" class="body fw" font-size="14" font-weight="700">offline-bundle.toml</text><text x="216" y="145" class="body" fill="#CFE3D6" font-size="10" font-style="italic">in acorn-planter/; declares the bundle</text><text x="216" y="157" class="body" fill="#CFE3D6" font-size="10" font-style="italic">resources, checked against global.conf</text><line x1="216" y1="167" x2="504" y2="167" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/><rect x="216" y="175" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="225" y="190" class="body fg" font-size="11.5" font-weight="600">packages  →  wheels/</text><rect x="216" y="203" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="225" y="218" class="body fg" font-size="11.5" font-weight="600">pythons  →  python-builds/</text><rect x="216" y="231" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="225" y="246" class="body fg" font-size="9.5" font-weight="600">[editor] flavor / extensions / gallery  →  vendor/vscode/</text><rect x="216" y="259" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="225" y="274" class="body fg" font-size="11.5" font-weight="600">tools  →  conda-channel/</text><rect x="216" y="287" width="288" height="22" rx="6" fill="#FFFFFF" stroke="#1B4332" stroke-width="0.9"/><text x="225" y="302" class="body fg" font-size="11.5" font-weight="600">[git] mingit  →  vendor/git/</text><line x1="520" y1="213" x2="726" y2="213" stroke="#1B4332" stroke-width="1.6" marker-end="url(#arrow)"/><text x="625" y="205" text-anchor="middle" class="body fmute" font-size="10.5" font-style="italic">declares what to stage</text><text x="200" y="392" class="body fg" font-size="12.5" font-weight="700" letter-spacing="0.8">PULLED FROM</text><rect x="544" y="350" width="372" height="574" rx="14" fill="#EAF3EE" stroke="#1B4332" stroke-width="1.4"/><use href="#ic-box" x="560" y="362" width="20" height="20" color="#1B4332"/><text x="590" y="377" class="body fg" font-size="15" font-weight="700">offline-bundle/</text><text x="590" y="391" class="body fmute" font-size="11" font-style="italic">everything below is staged into this one folder tree</text><text x="40" y="437" class="body fg" font-size="12.5" font-weight="700">acorn-planter</text><rect x="200" y="406" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="429" class="body fg" font-size="13.0" font-weight="700">this git checkout</text><text x="212" y="446" class="body" fill="#52796F" font-size="10.8">global.conf, src/, installers/</text><rect x="560" y="406" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="429" class="body fw" font-size="13.0" font-weight="700">src/ + global.conf</text><text x="572" y="446" class="body" fill="#CFE3D6" font-size="10.8">source refreshed on every build</text><line x1="520" y1="433" x2="556" y2="433" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="501" class="body fg" font-size="12.5" font-weight="700">Packages + Spyder</text><rect x="200" y="470" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="493" class="body fg" font-size="13.0" font-weight="700">pypi.org</text><text x="212" y="510" class="body" fill="#52796F" font-size="10.8">acorn upload-whls &lt;wheels-dir&gt;</text><rect x="560" y="470" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="493" class="body fw" font-size="13.0" font-weight="700">wheels/</text><text x="572" y="510" class="body" fill="#CFE3D6" font-size="10.8">upload to the internal index</text><line x1="520" y1="497" x2="556" y2="497" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="565" class="body fg" font-size="12.5" font-weight="700">uv</text><rect x="200" y="534" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="557" class="body fg" font-size="13.0" font-weight="700">astral.sh</text><text x="212" y="574" class="body" fill="#52796F" font-size="10.8">the binary itself</text><rect x="560" y="534" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="557" class="body fw" font-size="13.0" font-weight="700">vendor/uv/</text><text x="572" y="574" class="body" fill="#CFE3D6" font-size="10.8">staged into the bundle</text><line x1="520" y1="561" x2="556" y2="561" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="629" class="body fg" font-size="12.5" font-weight="700">Interpreters</text><rect x="200" y="598" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="621" class="body fg" font-size="13.0" font-weight="700">python-build-standalone</text><text x="212" y="638" class="body" fill="#52796F" font-size="10.8">no internal PBS mirror</text><rect x="560" y="598" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="621" class="body fw" font-size="13.0" font-weight="700">python-builds/</text><text x="572" y="638" class="body" fill="#CFE3D6" font-size="10.8">staged into the bundle</text><line x1="520" y1="625" x2="556" y2="625" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="693" class="body fg" font-size="12.5" font-weight="700">conda-forge tools</text><rect x="200" y="662" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="685" class="body fg" font-size="13.0" font-weight="700">conda-forge</text><text x="212" y="702" class="body" fill="#52796F" font-size="10.8">no internal conda mirror</text><rect x="560" y="662" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="685" class="body fw" font-size="13.0" font-weight="700">conda-channel/</text><text x="572" y="702" class="body" fill="#CFE3D6" font-size="10.8">+ vendored micromamba</text><line x1="520" y1="689" x2="556" y2="689" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="757" class="body fg" font-size="12.5" font-weight="700">Editor</text><rect x="200" y="726" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="749" class="body fg" font-size="13.0" font-weight="700">VS Code Marketplace</text><text x="212" y="766" class="body" fill="#52796F" font-size="10.8">Marketplace is blocked here</text><rect x="560" y="726" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="749" class="body fw" font-size="13.0" font-weight="700">vendor/vscode/</text><text x="572" y="766" class="body" fill="#CFE3D6" font-size="10.8">staged into the bundle</text><line x1="520" y1="753" x2="556" y2="753" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="821" class="body fg" font-size="12.5" font-weight="700">Git</text><rect x="200" y="790" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="813" class="body fg" font-size="13.0" font-weight="700">git-for-windows</text><text x="212" y="830" class="body" fill="#52796F" font-size="10.8">no git host to clone from either</text><rect x="560" y="790" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="813" class="body fw" font-size="13.0" font-weight="700">vendor/git/</text><text x="572" y="830" class="body" fill="#CFE3D6" font-size="10.8">[git] mingit = true</text><line x1="520" y1="817" x2="556" y2="817" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/><text x="40" y="885" class="body fg" font-size="12.5" font-weight="700">CA cert</text><rect x="200" y="854" width="320" height="54" rx="9" fill="#E9F5EC" stroke="#1B4332" stroke-width="1" opacity="0.8"/><text x="212" y="877" class="body fg" font-size="13.0" font-weight="700">you supply it</text><text x="212" y="894" class="body" fill="#52796F" font-size="10.8">the proxy re-signs HTTPS</text><rect x="560" y="854" width="340" height="54" rx="9" fill="#1B4332" /><text x="572" y="877" class="body fw" font-size="13.0" font-weight="700">vendor/certs/</text><text x="572" y="894" class="body" fill="#CFE3D6" font-size="10.8">staged into the bundle</text><line x1="520" y1="881" x2="556" y2="881" stroke="#1B4332" stroke-width="1.4" marker-end="url(#arrow)"/></g>
